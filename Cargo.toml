[package]
name = "mercury-cortex-core"
version = "0.1.2"
edition = "2024"
description = "Core storage and cortex layer for mercury-cortex."
license = "MIT"
repository = "https://github.com/mercury-ai-1/mercury-cortex-core"
keywords = ["database", "cortex"]
categories = ["database"]

[lib]

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "signal"] }
surrealdb = { version = "=3.2.3", features = ["kv-surrealkv"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tracing = "=0.1.44"
anyhow = "=1.0.104"
thiserror = "=2.0.19"
sha2 = "=0.11.0"
async-trait = "=0.1.91"
walkdir = "=2.5.0"
dirs = "=6.0.0"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"